name: Build index and deploy to GitHub Pages

# Follows the pattern from
# https://bykovbrett.net/blog/host-your-website-on-github-pages-free-claude-prompts
# Every push to main regenerates index.md (a list of every Markdown
# file), assembles the site in _site/, and publishes it to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate index.md and assemble the site
        run: python3 scripts/build-index.py --site-dir _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
