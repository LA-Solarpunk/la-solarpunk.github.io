title:            LA Solarpunk
tagline:          Building a Bright Green Future in Los Angeles
description:      A community hub for solarpunk ideas, projects, and organizing in Los Angeles — where ecology, technology, and mutual aid grow together.
canonical:        http://la-solarpunk.github.io

# Owner/author information
owner:
  name:           LA Solarpunk Collective
  avatar:         avatar.png
  bio:            "Dreaming and building a solarpunk Los Angeles — ecological, cooperative, and radically hopeful."
  email:          hello@la-solarpunk.org
  twitter:        lasolarpunk
  github:         la-solarpunk
  instagram:      lasolarpunk
  location:       "Los Angeles, CA"

tools:
  standards:      "HTML, SCSS, Jekyll"
  software:       "git"

# Open Graph customization
opengraph:
  locale:         en_US

# Links to include in top navigation
links:
  - title: About
    url: /about
  - title: Articles
    url: /articles

timezone:    America/Los_Angeles
future:      true
highlighter: rouge
markdown:    kramdown

kramdown:
  auto_ids: true
  input: GFM

sass:
  style: compressed

permalink:   /:categories/:title

include: [".htaccess"]
exclude: ["lib", "config.rb", "Capfile", "config", "log", "Rakefile", "Rakefile.rb", "tmp", "vendor"]
