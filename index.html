<!DOCTYPE html>
<!--
  tiny-markdown standalone page.

  Two files ship together and work as a static site (e.g. GitHub Pages):

      index.template.html -> dist/index.html   (script + theme baked in)
      index.md            -> dist/index.md     (the content visitors read)

  `npm run build` does both: it inlines the tiny-markdown script (which
  already embeds the utility CSS) at the bundle marker below, and copies
  index.md next to it.

  Everything between the two STYLE EDIT markers in styles.css is
  yours: variables, fonts, spacing, page chrome. Edit it freely —
  the component only needs the <mark-down> element, the inlined
  script, and this page's <link> to styles.css to work.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tiny-markdown</title>

  <!-- Webfonts the theme variables in styles.css refer to. Remove or
       replace this if you want to use different (or local) fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Roboto+Condensed:ital,wght@0,900;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script type="module">

  display: block;
}

.tiny-markdown h1,
.tiny-markdown h2,
.tiny-markdown h3,
.tiny-markdown h4,
.tiny-markdown h5,
.tiny-markdown h6 {
  margin: 0.8em 0 0.4em;
}

.tiny-markdown p {
  margin: 0.6em 0;
}

.tiny-markdown code {
  background: rgba(0, 0, 0, 0.06);
  padding: 0.1em 0.3em;
  border-radius: 3px;
}

.tiny-markdown pre {
  background: rgba(0, 0, 0, 0.06);
  padding: 0.8em;
  overflow: auto;
  border-radius: 4px;
}

.tiny-markdown pre code {
  background: transparent;
  padding: 0;
}

.tiny-markdown ul,
.tiny-markdown ol {
  margin: 0.6em 0;
  padding-left: 1.5em;
}

.tiny-markdown blockquote {
  margin: 0.6em 0;
  padding-left: 1em;
  border-left: 3px solid rgba(0, 0, 0, 0.2);
  opacity: 0.9;
}

.tiny-markdown a {
  color: inherit;
}

.tiny-markdown .video-embed {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 4px;
}

/* ------------------------------------------------------------------ *
 * Page transitions (View Transitions API)
 *
 * Wikilink navigation swaps the element's content via
 * document.startViewTransition(). The element gets its own
 * view-transition-name so only it animates (not the whole page).
 * ------------------------------------------------------------------ */
mark-down {
  view-transition-name: markdown-content;
}

/* Default: a quick cross-fade. Customize the timing per project, e.g.
 * :root { --markdown-page-transition-duration: 400ms; } */
::view-transition-old(markdown-content),
::view-transition-new(markdown-content) {
  animation-duration: var(--markdown-page-transition-duration, 220ms);
  animation-timing-function: ease-in-out;
}

 * }
 * @keyframes markdown-slide-in {
 *   from { opacity: 0; transform: translateY(12px); }
 * }
 * ::view-transition-old(markdown-content) {
 *   animation-name: markdown-slide-out;
 * }
 * ::view-transition-new(markdown-content) {
 *   animation-name: markdown-slide-in;

  <script type="module">
    // Note header from front matter.
    //
    // Also note: the bundled renderer's underscore emphasis was
    // patched to /(?<![^\s])_([^_]+)_(?![^\s])/g (and likewise for
    // __strong__) — a _..._ / __...__ span is only emphasized when
    // its opening delimiter is at the start or after whitespace and
    // its closing delimiter is at the end or before whitespace.
    // Underscores surrounded by non-space characters (snake_case,
    // filenames like water_from_the_stream.jpg) are left literal.
    // Search the bundle above for "(?<![^" to find it.
    //
    // The renderer exposes each note's front matter as attributes on
    // the <mark-down> element (e.g. title="..." date="...") and
    // renders only the body. If a note has a "title", show it as
    // <h1>{{title}}</h1> at the top; if it also has a "date", show
    // <h3>{{date}}</h3> directly underneath. Re-syncs on every render
    // (initial load and wikilink navigation).
    const note = document.querySelector("mark-down");
    if (note) {
      const syncNoteHeader = () => {
        const title = note.getAttribute("title");
        const date = note.getAttribute("date");
        const headers = [
          ...note.querySelectorAll(":scope > .note-title, :scope > .note-date"),
        ];
        const desired = [
          title && `H1:${title}`,
          date && `H3:${date}`,
        ]
          .filter(Boolean)
          .join("|");
        const current = headers
          .map((el) => `${el.tagName}:${el.textContent}`)
          .join("|");
        const atTop = headers.every(
          (el, i) => el === note.children[i],
        );
        // Already in sync: bail out (also stops the observer looping
        // on the header we insert ourselves).
        if (current === desired && atTop) return;

        headers.forEach((el) => el.remove());
        const fragment = document.createDocumentFragment();
        if (title) {
          const h1 = document.createElement("h1");
          h1.className = "note-title";
          h1.textContent = title;
          fragment.append(h1);
        }
        if (date) {
          const h3 = document.createElement("h3");
          h3.className = "note-date";
          h3.textContent = date;
          fragment.append(h3);
        }
        if (fragment.firstChild) note.prepend(fragment);
      };

      new MutationObserver(syncNoteHeader).observe(note, {
        childList: true,
        attributes: true,
        attributeFilter: ["title", "date"],
      });
      syncNoteHeader();
    }
  </script>
</head>
<body>
  <header>
    <h1 class="logo"><a href="http://lasolarpunk.com">LA Solar Punk</a></h1>
  </header>
  <mark-down src="index.md"></mark-down>
</body>
